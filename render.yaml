services:
  - type: web
    name: sirps-prototype
    env: python
    runtime: python
    plan: free
    healthCheckPath: /_stcore/health
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
